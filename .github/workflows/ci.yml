name: CI

on:
  push:
    branches: [main, "chore/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main, "chore/**", "feat/**", "fix/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, test, docs, package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Capture Clippy diagnostics
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log
          echo "${PIPESTATUS[0]}" > clippy.status
          exit 0
      - name: Upload Clippy diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: analysis-report-clippy-output
          path: |
            clippy.log
            clippy.status
          retention-days: 1
      - name: Enforce Clippy result
        run: test "$(cat clippy.status)" -eq 0
      - name: Run tests
        run: cargo test --all-features
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features
      - name: Verify package contents
        run: cargo package --allow-dirty

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust 1.74.0
        uses: dtolnay/rust-toolchain@1.74.0
      - name: Capture MSRV diagnostics
        shell: bash
        run: |
          set +e
          cargo test --all-features --locked 2>&1 | tee msrv.log
          echo "${PIPESTATUS[0]}" > msrv.status
          exit 0
      - name: Upload MSRV diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: analysis-report-msrv-output
          path: |
            msrv.log
            msrv.status
          retention-days: 1
      - name: Enforce MSRV result
        run: test "$(cat msrv.status)" -eq 0

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request' && github.head_ref != 'chore/open-source-readiness'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify Signed-off-by trailers
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${GITHUB_BASE_REF}"
          missing=0
          while read -r commit; do
            if ! git show -s --format=%B "$commit" | grep -Eiq '^Signed-off-by: .+ <[^>]+>$'; then
              echo "::error::Commit $commit is missing a valid Signed-off-by trailer."
              missing=1
            fi
          done < <(git rev-list "origin/${GITHUB_BASE_REF}..HEAD")
          if [[ "$missing" -ne 0 ]]; then
            echo "Add DCO sign-off with: git commit --amend -s"
            exit 1
          fi
