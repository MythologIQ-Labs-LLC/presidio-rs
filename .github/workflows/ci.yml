name: CI

on:
  push:
    branches: [main, feat/analysis-request-recognizer-trait]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-format:
    name: Apply request contract formatting once
    if: github.event_name == 'push' && github.ref_name == 'feat/analysis-request-recognizer-trait'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/analysis-request-recognizer-trait
      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply formatting
        run: cargo fmt --all
      - name: Commit canonical formatting when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Kevin Knapp"
          git config user.email "krknapp@gmail.com"
          git add src tests
          git commit -m "style: apply canonical Rust formatting

          Signed-off-by: Kevin Knapp <krknapp@gmail.com>"
          git push origin HEAD:feat/analysis-request-recognizer-trait

  quality:
    name: Format, lint, test, docs, package
    if: github.event_name == 'pull_request' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-features
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features
      - name: Verify package contents
        run: cargo package --allow-dirty

  msrv:
    name: Minimum supported Rust version
    if: github.event_name == 'pull_request' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust 1.74.0
        uses: dtolnay/rust-toolchain@1.74.0
      - name: Test all features on MSRV
        run: cargo test --all-features --locked

  dependency-audit:
    name: Dependency audit
    if: github.event_name == 'pull_request' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request' && github.head_ref != 'chore/open-source-readiness'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify Signed-off-by trailers
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${GITHUB_BASE_REF}"
          missing=0
          while read -r commit; do
            if ! git show -s --format=%B "$commit" | grep -Eiq '^Signed-off-by: .+ <[^>]+>$'; then
              echo "::error::Commit $commit is missing a valid Signed-off-by trailer."
              missing=1
            fi
          done < <(git rev-list "origin/${GITHUB_BASE_REF}..HEAD")
          if [[ "$missing" -ne 0 ]]; then
            echo "Add DCO sign-off with: git commit --amend -s"
            exit 1
          fi
