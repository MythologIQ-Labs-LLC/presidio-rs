name: One-time public clone SHA correction

on:
  push:
    branches: [docs/public-accelerated-rebaseline]

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare the public clone with the PR head SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/release-candidate-rehearsal.yml')
          text = path.read_text()
          old_env = "          SOURCE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}\n"
          new_env = old_env + "          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}\n"
          if text.count(old_env) != 1:
              raise SystemExit('expected SOURCE_REF environment line exactly once')
          text = text.replace(old_env, new_env, 1)
          old_check = '          test "$(git -C "$candidate" rev-parse HEAD)" = "$GITHUB_SHA"\n'
          new_check = '          test "$(git -C "$candidate" rev-parse HEAD)" = "$EXPECTED_SHA"\n'
          if text.count(old_check) != 1:
              raise SystemExit('expected SHA comparison exactly once')
          path.write_text(text.replace(old_check, new_check, 1))
          PY

      - name: Commit correction and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-public-clone-bootstrap.yml
          git config user.name "Kevin Knapp"
          git config user.email "krknapp@gmail.com"
          git add .github/workflows/release-candidate-rehearsal.yml
          git commit -s -m "ci: verify public clone against PR head SHA"
          git push origin HEAD
