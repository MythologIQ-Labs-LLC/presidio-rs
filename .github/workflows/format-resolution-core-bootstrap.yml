name: One-time resolution core formatting

on:
  push:
    branches: [feat/resolution-core-v1]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply canonical Rust formatting
        run: cargo fmt --all

      - name: Commit formatting and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/format-resolution-core-bootstrap.yml
          git config user.name "Kevin Knapp"
          git config user.email "krknapp@gmail.com"
          git add src/resolution.rs src/lib.rs
          git commit -s -m "style: apply canonical resolution formatting"
          git push origin HEAD
