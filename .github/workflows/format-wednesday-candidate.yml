name: Format Wednesday candidate once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'release/wednesday-candidate'
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply formatting and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          rm .github/workflows/format-wednesday-candidate.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'Kevin Knapp'
          git config user.email 'krknapp@gmail.com'
          git commit -m 'style: apply canonical release formatting' \
            -m 'Signed-off-by: Kevin Knapp <krknapp@gmail.com>'
          git push origin HEAD:${GITHUB_HEAD_REF}
