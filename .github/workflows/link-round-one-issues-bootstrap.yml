name: One-time round-one issue links

on:
  push:
    branches: [docs/round-one-resolution-plan]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Link implementation issues
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/planning/FIRST_DEVELOPMENT_ROUND.md')
          text = path.read_text()
          old = '''1. **Evidence and contract freeze:** complete the overlap decision ledger, threat assumptions, ADR, and test matrix specification.
2. **Pure resolution engine:** implement value types, three policies, deterministic behavior, and table-driven tests without analyzer integration.
3. **Analysis-report integration:** expose the additive authoritative entry point, preserve document binding, add examples and migration guidance, and run downstream compile evidence.'''
          new = '''1. **#40 Evidence and contract freeze:** complete the overlap decision ledger, threat assumptions, ADR, and test matrix specification.
2. **#41 Pure resolution engine:** implement value types, three policies, deterministic behavior, and table-driven tests without analyzer integration.
3. **#42 Analysis-report integration:** expose the additive authoritative entry point, preserve document binding, add examples and migration guidance, and run downstream compile evidence.'''
          if text.count(old) != 1:
              raise SystemExit('expected implementation sequence exactly once')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit links and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/link-round-one-issues-bootstrap.yml
          git config user.name "Kevin Knapp"
          git config user.email "krknapp@gmail.com"
          git add docs/planning/FIRST_DEVELOPMENT_ROUND.md
          git commit -s -m "docs: link first development round issues"
          git push origin HEAD
