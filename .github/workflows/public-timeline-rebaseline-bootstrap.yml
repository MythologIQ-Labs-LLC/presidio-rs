name: One-time public timeline documentation rebaseline

on:
  push:
    branches: [docs/public-accelerated-rebaseline]

permissions:
  contents: write

jobs:
  rebaseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update public status and accelerated dates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one occurrence in {path}, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "README.md",
              "The repository is targeted to become publicly readable on **Thursday, July 30, 2026**.",
              "The repository became publicly readable on **Tuesday, July 28, 2026**, two days ahead of the original target.",
          )
          replace_once(
              "README.md",
              "The accelerated roadmap targets public repository visibility on July 30, contributor-ready alpha by August 14, consumer-ready beta by September 25, and a separate package and advertised-launch decision by October 30.",
              "The accelerated roadmap records public repository visibility on July 28, contributor-ready alpha by August 3, correctness and evaluation by August 21, consumer-ready beta by September 4, and a separate package and advertised-launch decision by October 2.",
          )

          plan = "docs/planning/DEVELOPMENT_PLAN.md"
          replacements = [
              (
                  "`presidio-rs` is targeted to become a **publicly readable GitHub repository on Thursday, July 30, 2026**.",
                  "`presidio-rs` became a **publicly readable GitHub repository on Tuesday, July 28, 2026**, two days ahead of the original target.",
              ),
              (
                  "This supersedes the original 30-week private-development sequencing. The project will expose its source earlier while continuing foundation work in public.",
                  "This supersedes the original 30-week private-development sequencing. The project exposed its source early and continues foundation work in public.",
              ),
              (
                  "- **Public by default after July 30; promotion by explicit decision.**",
                  "- **Public since July 28; promotion by explicit decision.**",
              ),
              (
                  "| R0. Public visibility release | Jul 27 to Jul 30, 2026 | Safely expose the repository without advertising or package publication |",
                  "| R0. Public visibility release | Jul 27 to Jul 28, 2026 | Completed public exposure without advertising or package publication |",
              ),
              (
                  "| R1. Contributor-ready public alpha | Jul 31 to Aug 14, 2026 | Complete release operations, examples, ownership, compatibility inventory, and first public contribution path |",
                  "| R1. Contributor-ready public alpha | Jul 28 to Aug 3, 2026 | Complete public operations, ownership, observation, and contribution-intake verification |",
              ),
              (
                  "| R2. Correctness and evaluation sprint | Aug 3 to Sep 4, 2026 | Deliver explicit resolution, fallible anonymization, evaluation baseline, and critical fuzz targets |",
                  "| R2. Correctness and evaluation sprint | Jul 28 to Aug 21, 2026 | Deliver explicit resolution, fallible anonymization, evaluation baseline, and critical fuzz targets |",
              ),
              (
                  "| R3. Consumer and compatibility sprint | Aug 17 to Sep 25, 2026 | Integrate two distinct consumers and establish downstream compatibility evidence |",
                  "| R3. Consumer and compatibility sprint | Aug 3 to Sep 4, 2026 | Integrate two distinct consumers and establish downstream compatibility evidence |",
              ),
              (
                  "| R4. Public beta candidate | Sep 28 to Oct 16, 2026 | Harden supported scope, package contents, API migration, security, and measured claims |",
                  "| R4. Public beta candidate | Sep 4 to Sep 18, 2026 | Harden supported scope, package contents, API migration, security, and measured claims |",
              ),
              (
                  "| R5. Package and launch decision | Oct 19 to Oct 30, 2026 | Decide crates.io publication and whether to actively announce the project |",
                  "| R5. Package and launch decision | Sep 18 to Oct 2, 2026 | Decide crates.io publication and whether to actively announce the project |",
              ),
              (
                  "| R6. Post-public maturity program | Nov 2, 2026 to Feb 26, 2027 | Continue hardening, broader evaluation, governance maturity, and optional semantic feasibility |",
                  "| R6. Post-public maturity program | Oct 5, 2026 to Feb 26, 2027 | Continue hardening, broader evaluation, governance maturity, and optional semantic feasibility |",
              ),
              (
                  "**Dates:** July 27 to July 30, 2026  \n**Target:** Public source access by Thursday, July 30",
                  "**Dates:** July 27 to July 28, 2026  \n**Status:** Completed with public source access on Tuesday, July 28",
              ),
              ("**Dates:** July 31 to August 14, 2026", "**Dates:** July 28 to August 3, 2026"),
              ("**Dates:** August 3 to September 4, 2026", "**Dates:** July 28 to August 21, 2026"),
              ("**Dates:** August 17 to September 25, 2026", "**Dates:** August 3 to September 4, 2026"),
              ("**Dates:** September 28 to October 16, 2026", "**Dates:** September 4 to September 18, 2026"),
              ("**Dates:** October 19 to October 30, 2026", "**Dates:** September 18 to October 2, 2026"),
              ("**Dates:** November 2, 2026 to February 26, 2027", "**Dates:** October 5, 2026 to February 26, 2027"),
          ]
          for old, new in replacements:
              replace_once(plan, old, new)

          release_week = "docs/planning/PUBLIC_RELEASE_WEEK.md"
          replace_once(
              release_week,
              "# Public Repository Release Week\n",
              "# Public Repository Release Week\n\n> Status: Public visibility completed Tuesday, July 28, 2026. This document remains the historical release runbook.\n",
          )
          replace_once(
              release_week,
              "The repository is targeted to become publicly readable on **Thursday, July 30, 2026**.",
              "The repository became publicly readable on **Tuesday, July 28, 2026**, two days ahead of the original target.",
          )
          replace_once(
              release_week,
              "Only the first decision is scheduled for July 30. The others require separate approval.",
              "The first decision completed on July 28. The other decisions still require separate approval.",
          )
          replace_once(
              release_week,
              "## Explicit non-blockers for July 30",
              "## Explicit non-blockers for public visibility",
          )
          replace_once(
              release_week,
              "- [x] Rebaseline the roadmap around July 30 visibility.",
              "- [x] Rebaseline the roadmap around accelerated public visibility.",
          )
          PY

      - name: Commit the exact documentation changes and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/public-timeline-rebaseline-bootstrap.yml
          git config user.name "Kevin Knapp"
          git config user.email "krknapp@gmail.com"
          git add README.md docs/planning/DEVELOPMENT_PLAN.md docs/planning/PUBLIC_RELEASE_WEEK.md
          git commit -s -m "docs: align roadmap with accelerated public timeline"
          git push origin HEAD
