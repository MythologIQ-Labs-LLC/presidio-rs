# Release-safety audit. This workflow is intentionally read-only.
name: Public visibility audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-visibility-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: History, provenance, and package audit
    runs-on: ubuntu-latest
    env:
      AUDIT_DIR: /tmp/public-visibility-audit
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch branches, tags, and pull-request refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'
          git fetch --force origin \
            '+refs/pull/*/head:refs/remotes/pull/*/head' \
            '+refs/pull/*/merge:refs/remotes/pull/*/merge' || true

      - name: Inventory refs, commits, objects, and metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$AUDIT_DIR"
          git for-each-ref --format='%(refname)%09%(objectname)' | sort > "$AUDIT_DIR/refs.tsv"
          git log --all --date=iso-strict --format='%H%x09%an%x09%ae%x09%ad%x09%s' > "$AUDIT_DIR/commits.tsv"
          git rev-list --objects --all > "$AUDIT_DIR/objects.tsv"
          git count-objects -vH > "$AUDIT_DIR/object-count.txt"
          git fsck --full --no-reflogs --unreachable > "$AUDIT_DIR/git-fsck.txt" 2>&1 || true

          patterns='Bicameral|Qortara|Accountable\.Live|empty-flagon|Celestara|mythologiq\.studio'
          : > "$AUDIT_DIR/internal-reference-paths.txt"
          while read -r commit; do
            git grep -IlE "$patterns" "$commit" -- . 2>/dev/null || true
          done < <(git rev-list --all) | sort -u > "$AUDIT_DIR/internal-reference-paths.txt"

          cut -f3 "$AUDIT_DIR/commits.tsv" | sort -u > "$AUDIT_DIR/author-emails.txt"

      - name: Install verified Gitleaks release
        shell: bash
        run: |
          set -euo pipefail
          release_json=$(curl -fsSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest)
          tag=$(jq -r '.tag_name' <<<"$release_json")
          asset=$(jq -r '.assets[].name | select(test("linux_x64\\.tar\\.gz$"))' <<<"$release_json" | head -n1)
          checksum_asset=$(jq -r '.assets[].name | select(test("checksums\\.txt$"))' <<<"$release_json" | head -n1)
          test -n "$tag" && test -n "$asset" && test -n "$checksum_asset"
          asset_url=$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .browser_download_url' <<<"$release_json")
          checksum_url=$(jq -r --arg name "$checksum_asset" '.assets[] | select(.name == $name) | .browser_download_url' <<<"$release_json")
          curl -fsSL "$asset_url" -o /tmp/gitleaks.tar.gz
          curl -fsSL "$checksum_url" -o /tmp/gitleaks-checksums.txt
          expected=$(awk -v asset="$asset" '$2 == asset {print $1}' /tmp/gitleaks-checksums.txt)
          test -n "$expected"
          echo "$expected  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version | tee "$AUDIT_DIR/gitleaks-version.txt"

      - name: Scan current tree and all fetched history for secrets
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gitleaks git . \
            --log-opts='--all --full-history' \
            --redact \
            --report-format=json \
            --report-path="$AUDIT_DIR/gitleaks-history.json" \
            --exit-code=0
          /tmp/gitleaks dir . \
            --redact \
            --report-format=json \
            --report-path="$AUDIT_DIR/gitleaks-tree.json" \
            --exit-code=0
          test -f "$AUDIT_DIR/gitleaks-history.json" || echo '[]' > "$AUDIT_DIR/gitleaks-history.json"
          test -f "$AUDIT_DIR/gitleaks-tree.json" || echo '[]' > "$AUDIT_DIR/gitleaks-tree.json"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Produce package and license evidence
        shell: bash
        run: |
          set -euo pipefail
          cargo package --list --allow-dirty > "$AUDIT_DIR/cargo-package-list.txt"
          cargo package --allow-dirty
          cargo metadata --locked --all-features --format-version 1 > "$AUDIT_DIR/cargo-metadata.json"
          jq -r '.packages[] | [.name, .version, (.license // "MISSING"), (.source // "workspace")] | @tsv' \
            "$AUDIT_DIR/cargo-metadata.json" | sort -u > "$AUDIT_DIR/dependency-licenses.tsv"

      - name: Summarize audit
        id: summary
        shell: bash
        run: |
          set -euo pipefail
          history_findings=$(jq 'length' "$AUDIT_DIR/gitleaks-history.json")
          tree_findings=$(jq 'length' "$AUDIT_DIR/gitleaks-tree.json")
          refs=$(wc -l < "$AUDIT_DIR/refs.tsv")
          commits=$(wc -l < "$AUDIT_DIR/commits.tsv")
          objects=$(wc -l < "$AUDIT_DIR/objects.tsv")
          package_files=$(wc -l < "$AUDIT_DIR/cargo-package-list.txt")
          internal_paths=$(wc -l < "$AUDIT_DIR/internal-reference-paths.txt")
          missing_licenses=$(awk -F '\t' '$3 == "MISSING" {count++} END {print count+0}' "$AUDIT_DIR/dependency-licenses.tsv")

          cat > "$AUDIT_DIR/AUDIT-SUMMARY.md" <<EOF
          # Public visibility audit summary

          - Commit: $GITHUB_SHA
          - Refs fetched: $refs
          - Commits scanned: $commits
          - Objects inventoried: $objects
          - Gitleaks history findings: $history_findings
          - Gitleaks current-tree findings: $tree_findings
          - Internal-reference paths requiring manual review: $internal_paths
          - Cargo package files: $package_files
          - Dependencies with missing license metadata: $missing_licenses

          This automated result supplements, but does not replace, maintainer review of naming, copyright ownership, provenance, contribution terms, GitHub settings, and acceptable author metadata.
          EOF
          cat "$AUDIT_DIR/AUDIT-SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$history_findings" -ne 0 || "$tree_findings" -ne 0 || "$missing_licenses" -ne 0 ]]; then
            echo '::error::Public visibility audit found secret or dependency-license findings requiring review.'
            exit 1
          fi

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-visibility-audit
          path: /tmp/public-visibility-audit/
          if-no-files-found: error
          retention-days: 14
