name: Release candidate rehearsal

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rehearsal:
    name: Fresh clone, public surfaces, docs, examples, package
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify required public repository files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            LICENSE
            SECURITY.md
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            GOVERNANCE.md
            CONTRIBUTOR_LICENSE_AGREEMENT.md
            CHANGELOG.md
            Cargo.toml
            Cargo.lock
            .github/CODEOWNERS
            .github/PULL_REQUEST_TEMPLATE.md
            .github/ISSUE_TEMPLATE/bug_report.yml
            .github/ISSUE_TEMPLATE/feature_request.yml
            .github/ISSUE_TEMPLATE/config.yml
            .github/dependabot.yml
            docs/README.md
            docs/api/PUBLIC_API_STATUS.md
            docs/api/MIGRATION_GUIDE.md
            docs/contributing/FIRST_CONTRIBUTION.md
            tools/verify_markdown_links.py
            examples/legacy_quickstart.rs
            examples/document_analysis.rs
            examples/strict_pattern_recognizer.rs
            examples/custom_backend.rs
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "::error::Missing required public file: $path"; exit 1; }
          done

      - name: Validate repository YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path); puts "validated #{path}" }' \
            .github/dependabot.yml \
            .github/ISSUE_TEMPLATE/bug_report.yml \
            .github/ISSUE_TEMPLATE/feature_request.yml \
            .github/ISSUE_TEMPLATE/config.yml

      - name: Verify relative Markdown links
        run: python3 tools/verify_markdown_links.py

      - name: Create unauthenticated public network clone
        id: clone
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          SOURCE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/public-candidate"
          public_url="https://github.com/${SOURCE_REPOSITORY}.git"
          export GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          git -c credential.helper= -c http.extraHeader= clone --no-checkout --filter=blob:none "$public_url" "$candidate"
          git -C "$candidate" -c credential.helper= -c http.extraHeader= fetch --depth 1 origin "refs/heads/${SOURCE_REF}"
          git -C "$candidate" checkout --detach FETCH_HEAD
          test "$(git -C "$candidate" rev-parse HEAD)" = "$EXPECTED_SHA"
          git -C "$candidate" clean -xffd
          test -z "$(git -C "$candidate" status --porcelain)"
          echo "path=$candidate" >> "$GITHUB_OUTPUT"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build and test fresh clone
        working-directory: ${{ steps.clone.outputs.path }}
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo build --all-features --locked
          cargo test --all-features --locked
          cargo test --doc --all-features --locked
          cargo doc --no-deps --all-features

      - name: Run documented examples
        working-directory: ${{ steps.clone.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --example legacy_quickstart
          cargo run --locked --example document_analysis
          cargo run --locked --example strict_pattern_recognizer
          cargo run --locked --example custom_backend

      - name: Inspect package and rehearse publication
        working-directory: ${{ steps.clone.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-candidate-evidence"
          cargo package --locked
          cargo package --list --locked > "$RUNNER_TEMP/release-candidate-evidence/cargo-package-list.txt"
          if grep -E '^(\.github/|target/|audit/)' "$RUNNER_TEMP/release-candidate-evidence/cargo-package-list.txt"; then
            echo "::error::Package contains repository-only or generated files."
            exit 1
          fi
          cargo publish --dry-run --locked

      - name: Record candidate identity and toolchain
        working-directory: ${{ steps.clone.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/release-candidate-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/commit-sha.txt"
          git status --porcelain > "$evidence/git-status.txt"
          rustc --version > "$evidence/rustc-version.txt"
          cargo --version > "$evidence/cargo-version.txt"
          sha256sum README.md LICENSE Cargo.lock Cargo.toml > "$evidence/core-file-sha256.txt"
          cat > "$evidence/REHEARSAL-SUMMARY.md" <<EOF
          # Release candidate rehearsal

          - Candidate commit: $(git rev-parse HEAD)
          - Unauthenticated public GitHub network clone: passed
          - Exact candidate SHA verification: passed
          - Required public files: passed
          - Repository YAML parsing: passed
          - Relative Markdown links: passed
          - Formatting, Clippy, build, tests, doctests, and rustdoc: passed
          - Documented examples: passed
          - Cargo package inspection: passed
          - Cargo publish dry run: passed
          EOF
          cat "$evidence/REHEARSAL-SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-rehearsal
          path: ${{ runner.temp }}/release-candidate-evidence/
          if-no-files-found: error
          retention-days: 14
