name: One-time resolution README update

on:
  push:
    branches: [feat/resolution-core-v1]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add the pure resolution path to the README
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          old = '''Migration and compatibility references:

- [Public API status](docs/api/PUBLIC_API_STATUS.md)
- [Legacy-to-request migration guide](docs/api/MIGRATION_GUIDE.md)

## Expected use cases
'''
          new = '''Migration and compatibility references:

- [Public API status](docs/api/PUBLIC_API_STATUS.md)
- [Legacy-to-request migration guide](docs/api/MIGRATION_GUIDE.md)

### Explicit candidate resolution

The pure version-1 resolver is available independently from analyzer integration:

```rust
use presidio::{
    resolve_candidates, AnalysisRequest, AnalyzerEngine, DocumentId,
    ResolutionOptions, ResolutionPolicy, TextDocument,
};

let document = TextDocument::new(
    DocumentId::new("request-42").expect("valid document ID"),
    "Email jane@acme.com",
);
let report = AnalyzerEngine::new()
    .analyze_request(&document, &AnalysisRequest::new())
    .expect("bounded analysis");
report
    .validate_for_document(&document)
    .expect("matching source document");

let resolved = resolve_candidates(
    report.candidates(),
    &ResolutionOptions::new(ResolutionPolicy::ConservativeRedaction),
)
.expect("complete resolution");

assert!(resolved.status().output_complete());
assert_eq!(resolved.policy_id(), "conservative_redaction");
```

`ReportAll` preserves all qualifying candidates, `BestCandidate` selects a deterministic non-overlapping set, and `ConservativeRedaction` unions connected strict-overlap components. Adjacent spans remain separate. Raw candidates remain available in both the analysis report and the separate resolution report.

The resolver does not transform text. Additive `AnalysisReport` integration and document-bound validation remain #42; fallible anonymization follows after that contract is complete.

- [ADR 0009: Version explicit candidate resolution](docs/adr/0009-version-explicit-candidate-resolution.md)
- [Resolution conformance matrix](docs/testing/RESOLUTION_CONFORMANCE_MATRIX.md)
- [Runnable resolution example](examples/resolution_policies.rs)

## Expected use cases
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected README insertion point once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit README update and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/update-resolution-readme-bootstrap.yml
          git config user.name "Kevin Knapp"
          git config user.email "krknapp@gmail.com"
          git add README.md
          git commit -s -m "docs: add pure resolution quickstart"
          git push origin HEAD
