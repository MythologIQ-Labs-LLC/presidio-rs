[package]
name = "presidio-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
authors = ["MythologIQ Labs LLC"]
description = "Offline, Rust-native PII detection and anonymization inspired by Microsoft Presidio's model-free architecture."
license = "MIT"
readme = "README.md"
repository = "https://github.com/MythologIQ-Labs-LLC/presidio-rs"
documentation = "https://docs.rs/presidio-rs"
keywords = ["pii", "privacy", "redaction", "anonymization", "security"]
categories = ["text-processing", "development-tools"]
exclude = [
    ".github/",
    "OPEN_SOURCE_RELEASE_CHECKLIST.md",
]

[lib]
name = "presidio"
path = "src/lib.rs"

[dependencies]
regex = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]
